name: BTC RSI alert

on:
  schedule:
    # เช็กการตัดเข้าโซน 70/30 วันละ 4 รอบ (UTC 00:17 = 07:17 เวลาไทย หลังแท่ง 1D ปิด รอบที่เหลือเป็นตัวสำรองกันถูกข้าม)
    - cron: "17 0,6,12,18 * * *"
    # สรุป RSI ทุกวันจันทร์ 07:43 เวลาไทย (00:43 UTC) หลังแท่ง 1W ปิดแล้ว
    - cron: "43 0 * * 1"
  workflow_dispatch:
    inputs:
      timeframes:
        description: "ไทม์เฟรมที่จะเช็กรอบนี้ เช่น 1D,1W"
        required: false
        default: ""
      mode:
        description: "run = เช็กจริง | status = ดูค่า RSI ใน log | summary = ส่งสรุป RSI เข้า Telegram | test = ส่งข้อความทดสอบ"
        required: false
        default: "run"
        type: choice
        options: [run, status, summary, test]

# ต้องเขียนไฟล์ state/alerts.json กลับเข้า repo เพื่อจำว่าแจ้งแท่งไหนไปแล้ว
permissions:
  contents: write

# กันสองรอบรันทับกันแล้วเขียน state ชนกัน
concurrency:
  group: rsi-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # รันสคริปต์ ไทม์เฟรมเริ่มต้นเหลือแค่ 1D กับ 1W (ปรับได้ด้วย Variable ชื่อ TIMEFRAMES)
      - name: Run RSI check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIMEFRAMES: ${{ inputs.timeframes || vars.TIMEFRAMES || '1D,1W' }}
          SYMBOL: ${{ vars.SYMBOL || 'BTC-USDT' }}
          RSI_PERIOD: ${{ vars.RSI_PERIOD || '7' }}
          OVERBOUGHT: ${{ vars.OVERBOUGHT || '70' }}
          OVERSOLD: ${{ vars.OVERSOLD || '30' }}
          # ใช้เฉพาะรอบแรกสุดที่ยังไม่มีไฟล์ state
          WINDOW_MINUTES: "60"
          # รอบ cron วันจันทร์ 00:43 UTC = สรุปรายสัปดาห์ รอบอื่น = เช็กปกติ
          MODE: ${{ inputs.mode || (github.event.schedule == '43 0 * * 1' && 'summary') || 'run' }}
        run: |
          case "$MODE" in
            status)  npx tsx src/index.ts --status ;;
            summary) npx tsx src/index.ts --summary ;;
            test)    npx tsx src/index.ts --test ;;
            *)       npx tsx src/index.ts ;;
          esac

      # บันทึก state กลับเข้า repo เฉพาะเมื่อไฟล์เปลี่ยน
      - name: Save alert state
        if: ${{ always() }}
        run: |
          if [ -n "$(git status --porcelain state/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/
            git commit -m "chore: update alert state"
            git pull --rebase
            git push
          else
            echo "state unchanged"
          fi
